<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>补零 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>数字</span><span class="sep">/</span><span class="here">补零</span></div></div>
<div class="toolbar">
  <div class="group">
    <label>宽度 <input id="width" type="number" class="input" value="6" min="1" max="32" style="width:80px;"></label>
    <label>字符 <input id="padChar" class="input" value="0" style="width:60px;"></label>
    <label class="checkbox-row"><input type="checkbox" id="keepSignChk"> 保留负号</label>
  </div>
  <div class="group">
    <button class="btn primary" id="padBtn">补齐</button>
    <button class="btn primary" id="rmPadBtn">去除前导零</button>
  </div>
  <div class="group"><button class="btn" id="copyR">复制</button><button class="btn" id="clearBtn">清空</button><button class="btn" id="sampleBtn">示例</button></div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>
<div class="split">
  <div class="pane"><div class="pane-head"><span class="title">原文</span></div><div class="pane-body"><textarea id="left" spellcheck="false"></textarea></div></div>
  <div class="pane"><div class="pane-head"><span class="title">结果</span></div><div class="pane-body"><textarea id="right" spellcheck="false"></textarea></div></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="number-zero.js"></script>
</body></html>
