<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列表 ↔ 行 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>文本</span><span class="sep">/</span><span class="here">列表 ↔ 行</span></div></div>
<div class="toolbar">
  <div class="group">
    <label>分隔符 <select id="sep" class="select"><option value=",">逗号</option><option value=";">分号</option><option value="|">竖线</option><option value="\n">换行</option></select></label>
    <label class="checkbox-row"><input type="checkbox" id="trimChk" checked> 去空白</label>
    <label class="checkbox-row"><input type="checkbox" id="uniqueChk"> 去重</label>
  </div>
  <div class="group">
    <button class="btn primary" id="linesBtn">列表 → 行</button>
    <button class="btn primary" id="listBtn">行 → 列表</button>
  </div>
  <div class="group"><button class="btn" id="swapBtn">交换</button><button class="btn" id="copyR">复制</button></div>
  <div class="group"><button class="btn" id="clearBtn">清空</button><button class="btn" id="sampleBtn">示例</button></div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>
<div class="split">
  <div class="pane"><div class="pane-head"><span class="title">原文</span></div><div class="pane-body"><textarea id="left" spellcheck="false"></textarea></div></div>
  <div class="pane"><div class="pane-head"><span class="title">结果</span></div><div class="pane-body"><textarea id="right" spellcheck="false"></textarea></div></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="list-line.js"></script>
</body></html>
