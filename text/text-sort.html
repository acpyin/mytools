<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本排序 · MyTools</title>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>文本</span><span class="sep">/</span><span class="here">文本排序</span></div></div>
<div class="toolbar">
  <div class="group">
    <label>方向 <select id="dirSel" class="select"><option value="asc">升序</option><option value="desc">降序</option></select></label>
    <label class="checkbox-row"><input type="checkbox" id="caseChk"> 区分大小写</label>
    <label class="checkbox-row"><input type="checkbox" id="numericChk"> 按数字</label>
  </div>
  <div class="group">
    <button class="btn primary" id="sortBtn">排序</button>
    <button class="btn" id="uniqueBtn">去重</button>
    <button class="btn" id="reverseBtn">反转</button>
    <button class="btn" id="shuffleBtn">乱序</button>
    <button class="btn" id="trimBtn">去空白</button>
    <button class="btn" id="copyR">复制</button>
  </div>
  <div class="group"><button class="btn" id="clearBtn">清空</button><button class="btn" id="sampleBtn">示例</button></div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>
<div class="split">
  <div class="pane"><div class="pane-head"><span class="title">原文</span></div><div class="pane-body"><textarea id="left" spellcheck="false"></textarea></div></div>
  <div class="pane"><div class="pane-head"><span class="title">结果</span></div><div class="pane-body"><textarea id="right" spellcheck="false"></textarea></div></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="text-sort.js"></script>
</body></html>
