<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
<style>
  .stats-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin: 16px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--text); margin-top: 4px; font-family: "SFMono-Regular", Consolas, monospace; }
</style>
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>文本</span><span class="sep">/</span><span class="here">字数统计</span></div></div>
<div style="padding: 16px 18px; flex: 1; display: flex; flex-direction: column;">
  <textarea id="input" spellcheck="false" placeholder="输入要统计的文本..." style="width:100%;height:280px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.55;background:#fff;color:var(--text);resize:vertical;outline:none;"></textarea>
  <div class="stats-card" id="stats"></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="word-count.js"></script>
</body></html>
