<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列表计算 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>文本</span><span class="sep">/</span><span class="here">列表计算</span></div></div>
<div class="toolbar">
  <div class="group">
    <label>每行 x <input id="mult" type="number" class="input" value="2" step="any" style="width:80px;"></label>
    <label>每行 + <input id="add" type="number" class="input" value="0" step="any" style="width:80px;"></label>
    <label class="checkbox-row"><input type="checkbox" id="sumChk"> 显示统计</label>
  </div>
  <div class="group">
    <button class="btn primary" id="calcBtn">计算</button>
    <button class="btn" id="copyR">复制</button>
    <button class="btn" id="clearBtn">清空</button>
    <button class="btn" id="sampleBtn">示例</button>
  </div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;">
  <div class="pane"><div class="pane-head"><span class="title">原文（每行一个数字）</span></div><div class="pane-body"><textarea id="left" spellcheck="false"></textarea></div></div>
  <div class="pane"><div class="pane-head"><span class="title">结果</span></div><div class="pane-body"><textarea id="right" spellcheck="false"></textarea></div></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="list-calc.js"></script>
</body></html>
