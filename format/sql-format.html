<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL 格式化 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/sidebar.css">
<link rel="stylesheet" href="../shared/editor.css">
</head>
<body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>格式化</span><span class="sep">/</span><span class="here">SQL 格式化</span></div></div>
<div class="toolbar">
  <div class="group">
    <button class="btn primary" id="formatBtn">美化</button>
    <button class="btn" id="minifyBtn">压缩</button>
    <button class="btn" id="swapBtn">交换</button>
    <button class="btn" id="copyR">复制</button>
  </div>
  <div class="group">
    <label>方言：
      <select id="dialectSel" class="select">
        <option value="sql">标准 SQL</option>
        <option value="mysql">MySQL</option>
        <option value="postgresql">PostgreSQL</option>
        <option value="tsql">SQL Server</option>
        <option value="plsql">Oracle PL/SQL</option>
        <option value="bigquery">BigQuery</option>
      </select>
    </label>
    <label>缩进：
      <select id="indentSel" class="select">
        <option value="2" selected>2 空格</option>
        <option value="4">4 空格</option>
      </select>
    </label>
  </div>
  <div class="group"><button class="btn" id="clearBtn">清空</button><button class="btn" id="sampleBtn">示例</button></div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>
<div class="split">
  <div class="pane"><div class="pane-head"><span class="title">原文</span></div><div class="pane-body"><textarea id="left" spellcheck="false"></textarea></div></div>
  <div class="pane"><div class="pane-head"><span class="title">结果</span></div><div class="pane-body"><textarea id="right" spellcheck="false"></textarea></div></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="../vendor/sql-formatter.min.js"></script>
<script src="format-sql.js"></script>
</body></html>
