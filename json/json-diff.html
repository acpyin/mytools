<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 对比 · MyTools</title>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<meta name="description" content="基于 CodeMirror MergeView 的 JSON 对比工具，行级背景色高亮差异，键入即对比。">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/sidebar.css">
<link rel="stylesheet" href="../vendor/codemirror.min.css">
<link rel="stylesheet" href="../vendor/codemirror-merge.min.css">
<link rel="stylesheet" href="../shared/diff.css">
</head>
<body>
<div class="topbar">
  <div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>对比</span><span class="sep">/</span><span class="here">JSON 对比</span></div>
  <div class="topbar-actions">
    <button class="btn ghost" id="formatBtn">格式化</button>
    <button class="btn ghost" id="unescapeBtn">反转义</button>
    <button class="btn ghost" id="sampleBtn">示例</button>
    <button class="btn ghost" id="swapBtn">交换</button>
    <button class="btn ghost" id="clearBtn">清空</button>
    <button class="btn ghost" id="settingsBtn" title="设置">⚙ 设置</button>
  </div>
</div>



<div class="headers-diff" id="headersDiff">
  <div class="pane-label" id="headerA"><span id="aLabel">空</span></div>
  <div class="pane-label" id="headerB"><span id="bLabel">空</span></div>
</div>

<main class="merge-wrap" id="mergeView"></main>

<div class="settings-modal" id="settingsModal" hidden>
  <div class="settings-card">
    <div class="settings-head">
      <span>设置</span>
      <button class="close" id="settingsClose" title="关闭">✕</button>
    </div>
    <div class="settings-body">
      <label>
        <span>JSON 缩进</span>
        <select id="optIndent">
          <option value="2">2 空格</option>
          <option value="4" selected>4 空格</option>
          <option value="0">Tab</option>
        </select>
      </label>
      <label>
        <span>差异显示</span>
        <select id="optHighlight">
          <option value="all" selected>所有差异</option>
          <option value="changes">仅修改</option>
          <option value="none">关闭</option>
        </select>
      </label>
      <label>
        <span>相同行折叠</span>
        <select id="optCollapse">
          <option value="0">不折叠</option>
          <option value="3">连续 3 行</option>
          <option value="5" selected>连续 5 行</option>
          <option value="10">连续 10 行</option>
        </select>
      </label>
      <label>
        <span>自动聚焦左侧输入框</span>
        <input type="checkbox" id="optAutoFocus" checked>
      </label>
      <div class="settings-section">
        <div class="settings-section-title">差异下划线与色觉辅助</div>
        <label>
          <span>色觉模式</span>
          <select id="optVisionMode">
            <option value="default">默认（蓝 / 橙）</option>
            <option value="deuteranopia">绿色弱 / 绿色盲</option>
            <option value="protanopia">红色弱 / 红色盲</option>
            <option value="tritanopia">蓝黄色弱 / 蓝黄色盲</option>
            <option value="monochrome">单色高对比</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label>
          <span>A 侧下划线</span>
          <span class="color-preview"><input type="color" id="optAUnderline" value="#0072b2"><code id="optAUnderlineText">#0072b2</code></span>
        </label>
        <label>
          <span>B 侧下划线</span>
          <span class="color-preview"><input type="color" id="optBUnderline" value="#d55e00"><code id="optBUnderlineText">#d55e00</code></span>
        </label>
      </div>
    </div>
    <div class="settings-foot">
      <button class="btn ghost" id="settingsReset">重置默认</button>
      <button class="btn primary" id="settingsSave">保存</button>
    </div>
  </div>
</div>

<script src="../shared/base.js"></script>
<script src="../shared/tools-config.js"></script>
<script src="../shared/app-shell.js"></script>
<script defer src="../vendor/diff_match_patch.min.js"></script>
<script defer src="../vendor/codemirror.min.js"></script>
<script defer src="../vendor/codemirror-javascript.min.js"></script>
<script defer src="../vendor/codemirror-merge.min.js"></script>
<script src="../shared/diff-settings.js"></script>
<script src="diff.js"></script>
</body>
</html>
