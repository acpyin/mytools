<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSONPath 提取 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
<style>
  .results { background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-height:120px;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word; }
</style>
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>更多</span><span class="sep">/</span><span class="here">JSONPath 提取器</span></div></div>
<div class="toolbar">
  <div class="group">
    <label>JSONPath <input id="jp" class="input" value="$.store.book[*].title" style="width:300px;font-family:'SFMono-Regular',Consolas,monospace;"></label>
    <button class="btn primary" id="runBtn">提取</button>
  </div>
  <div class="group">
    <button class="btn" id="copyAll">复制结果</button>
    <button class="btn" id="sampleBtn">示例</button>
    <button class="btn" id="clearBtn">清空</button>
  </div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0;padding:0 18px 18px;">
  <div class="pane"><div class="pane-head"><span class="title">JSON 数据</span></div><div class="pane-body"><textarea id="json" spellcheck="false"></textarea></div></div>
  <div class="pane"><div class="pane-head"><span class="title">提取结果</span></div>
    <div class="pane-body" style="display:block;padding:12px 16px;"><div id="out" class="results">—</div></div>
  </div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="jsonpath.js"></script>
</body></html>
