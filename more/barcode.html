<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
<style>
  .bc-wrap { padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .bc-canvas { background:#fff; padding:14px; border:1px solid var(--border); border-radius:10px; text-align:center; min-height: 140px; }
  .bc-canvas svg { max-width:100%; height: auto; }
</style>
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>更多</span><span class="sep">/</span><span class="here">条形码</span></div></div>
<div class="bc-wrap">
  <div>
    <label>文本 <input id="text" class="input" value="1234567890128" style="width:100%;"></label>
    <label style="display:block;margin-top:8px;">格式
      <select id="format" class="select">
        <option value="EAN13">EAN-13</option>
        <option value="EAN8">EAN-8</option>
        <option value="UPC">UPC</option>
        <option value="CODE128" selected>CODE128</option>
        <option value="CODE39">CODE39</option>
        <option value="CODE93">CODE93</option>
        <option value="ITF14">ITF-14</option>
      </select>
    </label>
    <label style="display:block;margin-top:8px;">显示文案 <input type="checkbox" id="textChk" checked></label>
  </div>
  <div class="bc-canvas" id="bc"></div>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="../vendor/JsBarcode.all.min.js"></script>
<script src="barcode.js"></script>
</body></html>
