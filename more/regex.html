<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则表达式测试 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/sidebar.css">
<link rel="stylesheet" href="../shared/editor.css">
<style>
  .regex-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .regex-input {
    flex: 1;
    min-width: 200px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 14px;
    outline: none;
  }
  .regex-input:focus { border-color: var(--primary); }
  .regex-input.invalid { border-color: var(--del); }
  .match-highlight { background: #fff7c2; border-radius: 3px; padding: 0 1px; }
  .stats { display: flex; gap: 14px; padding: 6px 18px; background: var(--bg-2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-soft); flex-wrap: wrap; }
  .stats b { color: var(--text); }
</style>
</head>
<body>
<div class="topbar">
  <div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>更多</span><span class="sep">/</span><span class="here">正则测试</span></div>
</div>

<div class="regex-bar">
  <span style="color:var(--primary);font-weight:700;">/</span>
  <input id="pattern" class="regex-input" placeholder="正则表达式..." value="\b\w+\b">
  <span style="color:var(--primary);font-weight:700;">/</span>
  <label class="checkbox-row"><input type="checkbox" id="gFlag" checked> g</label>
  <label class="checkbox-row"><input type="checkbox" id="iFlag"> i</label>
  <label class="checkbox-row"><input type="checkbox" id="mFlag"> m</label>
  <label class="checkbox-row"><input type="checkbox" id="sFlag"> s</label>
  <button class="btn" id="clearBtn">清空</button>
</div>

<div class="stats">
  <span><b id="matchCount">0</b> 处匹配</span>
  <span id="groupsStat"></span>
  <span id="errStat" style="color:var(--del);"></span>
</div>

<div style="position:relative; height: calc(100vh - 200px); min-height: 240px;">
  <pre id="highlight" style="position:absolute;inset:0;margin:0;padding:12px 16px;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;overflow:auto;color:transparent;background:#fff;pointer-events:none;user-select:none;"></pre>
  <textarea id="text" spellcheck="false" style="position:absolute;inset:0;width:100%;height:100%;padding:12px 16px;border:none;outline:none;font-family:'SFMono-Regular',Consolas,monospace;font-size:13px;line-height:1.55;background:transparent;color:var(--text);resize:none;" placeholder="待测试的文本..."></textarea>
</div>

<script src="../shared/base.js"></script>
<script src="../shared/tools-config.js"></script>
<script src="../shared/app-shell.js"></script>
<script src="regex.js"></script>
</body>
</html>
