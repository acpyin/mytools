<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 编码解码 · MyTools</title>
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/sidebar.css">
<link rel="stylesheet" href="../shared/editor.css">
</head>
<body>
<div class="topbar">
  <div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>转换</span><span class="sep">/</span><span class="here">URL 编码</span></div>
</div>

<div class="toolbar">
  <div class="group">
    <label class="checkbox-row"><input type="checkbox" id="plusChk"> 空格编码为 +</label>
    <label class="checkbox-row"><input type="checkbox" id="upperChk" checked> 百分号编码转大写</label>
  </div>
  <div class="group">
    <button class="btn primary" id="encodeBtn">编码 →</button>
    <button class="btn primary" id="decodeBtn">← 解码</button>
    <button class="btn" id="swapBtn">交换</button>
    <button class="btn" id="copyR">复制右侧</button>
  </div>
  <div class="group">
    <button class="btn" id="clearBtn">清空</button>
    <button class="btn" id="sampleBtn">示例</button>
  </div>
  <div id="status" class="status-msg" style="margin-left:auto;"></div>
</div>

<div class="split">
  <div class="pane">
    <div class="pane-head"><span class="title">原文</span><span class="meta" id="leftMeta">0 字符</span></div>
    <div class="pane-body"><textarea id="left" spellcheck="false" placeholder="原文文本..."></textarea></div>
  </div>
  <div class="pane">
    <div class="pane-head"><span class="title">结果</span><span class="meta" id="rightMeta">0 字符</span></div>
    <div class="pane-body"><textarea id="right" spellcheck="false" placeholder="编码 / 解码结果..."></textarea></div>
  </div>
</div>

<script src="../shared/base.js"></script>
<script src="../shared/tools-config.js"></script>
<script src="../shared/app-shell.js"></script>
<script src="url-encode.js"></script>
</body>
</html>
