<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片 Base64 · MyTools</title>
<link rel="stylesheet" href="../shared/base.css"><link rel="stylesheet" href="../shared/sidebar.css"><link rel="stylesheet" href="../shared/editor.css">
<style>
  .img-drop { border: 2px dashed var(--border); border-radius: 10px; padding: 32px; text-align: center; background: #fff; color: var(--muted); }
  .img-drop.drag { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .img-preview { max-width: 100%; max-height: 220px; margin: 12px auto; display: block; border: 1px solid var(--border); border-radius: 6px; }
</style>
</head><body>
<div class="topbar"><div class="crumb-bar"><span>MyTools</span><span class="sep">/</span><span>转换</span><span class="sep">/</span><span class="here">图片 Base64</span></div></div>
<div class="toolbar">
  <div class="group">
    <label>格式 <select id="fmt" class="select"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label>
    <label>质量 <input id="q" type="number" step="0.1" min="0.1" max="1" value="0.92" class="input" style="width:80px;"></label>
  </div>
  <div class="group">
    <button class="btn" id="clearBtn">清空</button>
    <button class="btn" id="copyR">复制 Base64</button>
  </div>
</div>
<div style="padding: 18px;">
  <div class="img-drop" id="drop">点击或拖拽图片到此处</div>
  <input id="fileIn" type="file" accept="image/*" hidden>
  <img id="preview" class="img-preview" style="display:none;" />
  <label style="display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 6px;">Base64 结果</label>
  <textarea id="out" spellcheck="false" style="width:100%;height:240px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-family:'SFMono-Regular',Consolas,monospace;font-size:12px;background:#fff;color:var(--text);resize:vertical;outline:none;" placeholder="data:image/png;base64,iVBORw0K..."></textarea>
</div>
<script src="../shared/base.js"></script><script src="../shared/tools-config.js"></script><script src="../shared/app-shell.js"></script>
<script src="image-base64.js"></script>
</body></html>
