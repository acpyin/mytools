<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTools · 开发者工具集</title>
<meta name="description" content="免费的在线开发者工具集。52 个常用工具，纯静态本地运行，数据不上传。">
<link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/sidebar.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="content">
  <div class="welcome">
    <div class="home-hero">
      <div class="hero-brand" aria-hidden="true">M</div>
      <div class="hero-copy">
        <h1>开发者常用工具，一站直达</h1>
        <p class="hero-summary">
          简单、快速、纯本地处理，数据不会离开你的浏览器。还是怕数据泄露风险？还是想二次修改创作，下载克隆，即可使用，点个star支持一下吧！
          <a class="github-link" href="https://github.com/acpyin/mytools"
             target="_blank" rel="noopener noreferrer"
             aria-label="在 GitHub 打开 acpyin/mytools">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 .8a11.4 11.4 0 0 0-3.6 22.2c.6.1.8-.2.8-.5v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.1 1.2A10.7 10.7 0 0 1 12 6.6c1 0 2.1.1 3.1.4 2.1-1.4 3.1-1.2 3.1-1.2.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.1v2.7c0 .3.2.6.8.5A11.4 11.4 0 0 0 12 .8Z"/>
            </svg>
            <span>acpyin/mytools</span>
          </a>
        </p>
      </div>
      <div class="hero-meta" aria-label="工具站信息">
        <span><strong>52</strong> 个工具</span>
        <span><strong>10</strong> 个分类</span>
        <span><strong>100%</strong> 浏览器端</span>
      </div>
    </div>

    <div class="home-search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="toolSearch" type="search" autocomplete="off"
             placeholder="搜索工具名称、功能或分类…"
             aria-label="搜索工具">
      <kbd>/</kbd>
      <span id="searchCount" aria-live="polite">52 个工具</span>
    </div>

    <section id="recentSection" class="home-section recent-section" style="display:none;">
      <div class="section-title-row">
        <h2>最近使用</h2>
        <button class="btn ghost" id="clearRecentBtn">清空记录</button>
      </div>
      <div class="recent-grid" id="recentGrid"></div>
    </section>

    <section id="allSection" class="home-section">
      <div class="section-title-row"><h2>所有工具</h2><span>按功能分类</span></div>
      <div id="categoriesGrid"></div>
      <div id="searchEmpty" class="search-empty" hidden>
        <strong>没有找到相关工具</strong>
        <span>换个名称或功能关键词试试</span>
      </div>
    </section>
  </div>
</div>

<footer class="footer"><span>MyTools © 2026 · 纯静态 · 数据不上传</span></footer>

<script src="../shared/base.js"></script>
<script src="../shared/tools-config.js"></script>
<script src="../shared/app-shell.js"></script>
<script src="home.js"></script>
</body>
</html>
